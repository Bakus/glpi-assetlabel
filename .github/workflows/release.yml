name: Release

# Pushing a tag vX.Y.Z builds assetlabel-X.Y.Z.tar.gz (plugin files in an assetlabel/
# directory, as GLPI and the Marketplace expect) and publishes a GitHub release with it.
# The release notes are the message of the annotated tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout stores the tag without its annotation; fetch it again to keep the notes
      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Check version numbers
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "PLUGIN_ASSETLABEL_VERSION = '${version}'" setup.php \
            || { echo "::error::setup.php does not declare version ${version}"; exit 1; }
          grep -q "<num>${version}</num>" assetlabel.xml \
            || { echo "::error::assetlabel.xml has no <version> entry for ${version}"; exit 1; }

      - name: Build archive
        run: git archive --format=tar.gz --prefix=assetlabel/ -o "assetlabel-${GITHUB_REF_NAME#v}.tar.gz" "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "assetlabel-${GITHUB_REF_NAME#v}.tar.gz" \
            --title "Asset Label ${GITHUB_REF_NAME#v}" \
            --notes-from-tag \
            --verify-tag
